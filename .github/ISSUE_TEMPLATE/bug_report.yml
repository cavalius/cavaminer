name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please leave out wallet addresses, passwords and API tokens you do not want public.
  - type: input
    id: version
    attributes:
      label: CavaMiner version
      description: "`cavaminer --version`"
      placeholder: "0.36.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - HiveOS
        - Other
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: GPUs / CPU and NVIDIA driver version
      placeholder: "RTX 4090, driver 580.95; Ryzen 9 7950X"
  - type: input
    id: pool
    attributes:
      label: Pool and algorithm
      placeholder: "PearlHash on de.pearl.herominers.com:1200"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The command line or settings you used, and the steps.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The relevant part of the log (`--log-file`, or `--log debug` for more detail).
      render: text
