<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72">
  <title>CavaMiner</title>
  <g transform="translate(2 4) scale(1)">
<defs>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0b3a22"/>
      <stop offset="0.38" stop-color="#2f8653"/>
      <stop offset="0.62" stop-color="#1d6640"/>
      <stop offset="1" stop-color="#082d1a"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8f6a10"/>
      <stop offset="0.45" stop-color="#f6d46a"/>
      <stop offset="1" stop-color="#7d5c0c"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.35" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="1" stop-color="#e2b23a"/>
    </radialGradient>
  </defs>
  <!-- bottle -->
  <path d="M23 13h10v2.2c0 .8-.3 1.4-.3 2.4V27c0 2.6 2 4.4 4.3 7 2 2.3 3 4.8 3 8V58a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4V42c0-3.2 1-5.7 3-8 2.3-2.6 4.3-4.4 4.3-7v-9.4c0-1-.3-1.6-.3-2.4z" fill="url(#glass)"/>
  <!-- foil over the cork and neck -->
  <path d="M22.4 11.5h11.2v3c0 .9-.4 1.5-.4 2.7V28.5H22.8V17.2c0-1.2-.4-1.8-.4-2.7z" fill="url(#foil)"/>
  <rect x="22.7" y="24.5" width="10.6" height="1.6" fill="#6f520b" opacity=".55"/>
  <!-- label -->
  <rect x="18.2" y="42.5" width="19.6" height="11.5" rx="1.4" fill="#f6eed6"/>
  <rect x="18.2" y="42.5" width="19.6" height="2" rx="1" fill="#b8292f"/>
  <text x="28" y="51.9" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" font-size="6.6" font-weight="700" text-anchor="middle" fill="#7a1d22" letter-spacing=".3">CAVA</text>
  <!-- glass highlight -->
  <path d="M20.6 38.5c-.9 1.4-1.3 2.8-1.3 4.4V58" stroke="#ffffff" stroke-opacity=".32" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- bubbles rising like sparks -->
  <circle cx="39.5" cy="15" r="3" fill="url(#bubble)"/>
  <circle cx="46" cy="9.5" r="2.3" fill="url(#bubble)" opacity=".92"/>
  <circle cx="51.5" cy="5" r="1.6" fill="url(#bubble)" opacity=".82"/>
  <circle cx="55.6" cy="1.9" r="1.1" fill="url(#bubble)" opacity=".7"/>
  <circle cx="44.5" cy="17.5" r="1.2" fill="url(#bubble)" opacity=".75"/>
  </g>
  <text x="66" y="50" font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" font-size="38" font-weight="700" fill="#1d6640">Cava<tspan fill="#c9971f">Miner</tspan></text>
</svg>
